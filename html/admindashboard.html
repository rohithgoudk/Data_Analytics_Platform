<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Console – Data Analytics Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admindashboard.css">
</head>
<body class="is-admin">

  <!-- Background -->
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--one" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--two" aria-hidden="true"></div>

  <!-- ============ SIDEBAR (fixed on desktop, drawer on tablet/phone) ============ -->
  <div class="scrim" id="scrim"></div>
  <aside class="dock" id="sidebar" aria-label="Admin menu">
    <div class="dock-head">
      <!-- Logo placeholder — replace src with your logo, e.g. images/logo.png -->
      <button class="brand" data-nav="dashboard" aria-label="Go to overview">
        <img class="brand-img" src="../assets/Logo.webp" alt="Company logo">
      </button>
      <button class="dock-close" id="dock-close" aria-label="Close menu">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="dock-status dock-status--admin">
      <span class="shield-dot">
        <svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg>
      </span>
      <div>
        <span class="dock-status-title">Admin console</span>
        <span class="dock-status-sub">4 regions · 12,480 users</span>
      </div>
    </div>

    <div class="dock-scroll" id="nav-drawer"></div>

    <div class="dock-foot">
      <div class="dock-user">
        <span class="avatar avatar--admin" id="sidebar-user-avatar">–</span>
        <div class="dock-user-info">
          <span class="dock-user-name" id="sidebar-user-name">Signed out</span>
          <span class="dock-user-email" id="sidebar-user-email">—</span>
        </div>
      </div>
      <button class="dock-signout" id="logout-btn" aria-label="Sign out" title="Sign out">
        <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5M15 12H3"/></svg>
      </button>
    </div>
  </aside>

  <!-- ============ TOP BAR ============ -->
  <header class="head" id="topbar">
    <div class="head-left">
      <button class="burger" id="hamburger-btn" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
        <span></span><span></span><span></span>
      </button>
      <button class="brand brand--head" data-nav="dashboard" aria-label="Go to overview">
        <img class="brand-img" src="../assets/Logo.webp" alt="Company logo">
      </button>
      <span class="admin-badge">
        <svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg>
        Admin
      </span>
    </div>

    <div class="head-right">
      <form class="finder" id="topbar-search" autocomplete="off" role="search">
        <button type="submit" class="finder-go" aria-label="Search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg>
        </button>
        <input id="topbar-search-input" placeholder="Search workspaces, users, regions…">
        <kbd class="finder-key">/</kbd>
      </form>

      <button class="icon-btn" id="notif-btn" aria-label="Access requests">
        <svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M10.5 20a2 2 0 0 0 3 0"/></svg>
        <span class="icon-dot"></span>
      </button>

      <div class="whoami" id="topbar-user">
        <button class="whoami-btn" id="topbar-user-btn" aria-haspopup="true" aria-expanded="false">
          <span class="avatar avatar--admin sm" id="topbar-user-avatar">–</span>
          <span class="whoami-text">
            <span class="whoami-name" id="topbar-user-name">Signed out</span>
            <span class="whoami-role" id="topbar-user-role">Administrator</span>
          </span>
          <svg class="whoami-caret" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="whoami-menu" id="topbar-user-menu">
          <div class="whoami-menu-head">
            <span>Signed in as</span>
            <span class="whoami-menu-email" id="topbar-user-email">—</span>
          </div>
          <button class="whoami-item" data-nav="settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>
            Settings
          </button>
          <button class="whoami-item" data-nav="security">
            <svg viewBox="0 0 24 24"><path d="M6 11h12v10H6zM8 11V8a4 4 0 0 1 8 0v3"/></svg>
            Security policy
          </button>
          <button class="whoami-item danger" id="topbar-logout-btn">
            <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5M15 12H3"/></svg>
            Sign out
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ============ PAGE ============ -->
  <main class="page">
    <div class="page-head">
      <div>
        <p class="page-kicker" id="page-kicker">Admin console</p>
        <h1 id="page-title-text">Overview</h1>
        <p class="page-sub" id="page-sub-text"></p>
      </div>
      <div class="page-actions" id="page-actions"></div>
    </div>
    <div class="content" id="content-area"></div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  function ico(name, cls) {
    return `<svg class="${cls || 'ico'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="${ICONS[name] || ICONS.grid}"/></svg>`;
  }

  /* =========================================================

     ========================================================= */

    'Growth':     '#22d3ee',
    'Starter':    '#fbbf24',
    'Trial':      '#f472b6'

  /* ---------- Customer workspaces ---------- */

    { name: 'Halcyon Media',       plan: 'Business',   seats: 120, mrr: 11200, arrYtd: 100800, status: 'Active',   since: 'Jun 2022', renewal: 'Nov 2026' },

    { name: 'Lumen Energy',        plan: 'Growth',     seats: 45,  mrr: 3600,  arrYtd: 32400,  status: 'At risk',  since: 'Feb 2025', renewal: 'Oct 2026' },
    { name: 'Cobalt Cloud',        plan: 'Trial',      seats: 12,  mrr: 0,     arrYtd: 0,      status: 'Trial',    since: 'Sep 2026', renewal: '—' },
    { name: 'Kinetic Motors',      plan: 'Starter',    seats: 0,   mrr: 0,     arrYtd: 8400,   status: 'Paused',   since: 'Apr 2024', renewal: '—' }

  /* ---------- Platform users (staff and customer admins) ---------- */
  const people = [
    { name: 'Aisha Rahman',  role: 'Head of Analytics',     workspace: 'Northwind Retail', access: 'Owner',   lastActive: '12m ago', status: 'Active' },
    { name: 'Leo Martins',   role: 'Data Engineer',         workspace: 'Internal',          access: 'Admin',   lastActive: '1h ago',  status: 'Active' },

  let approvals = [

    { id: 'REQ-308', who: 'Nina Kowalski', what: 'Export raw event data from Halcyon Media warehouse',  where: 'Halcyon Media', when: 'Yesterday' },
    { id: 'REQ-305', who: 'Ravi Iyer',     what: 'Reinstate data scientist login',                      where: 'Lumen Energy',  when: '2 days ago' }
  ];

  /* ---------- Audit log ---------- */
  let auditTrail = [
    { time: 'Today · 09:14',     actor: 'Tomás Novak',  action: 'Rotated the Snowflake service key',    target: 'Data warehouse connector',     scope: 'Integrations' },
    { time: 'Today · 08:00',     actor: 'System',       action: 'Ran the nightly access review',        target: '12,480 active logins',         scope: 'Platform-wide' },
    { time: 'Yesterday · 17:40', actor: 'Hannah Weber', action: 'Published a certified dataset',        target: 'Brightpath claims model',      scope: 'Brightpath Insurance' },
    { time: 'Yesterday · 14:15', actor: 'Admin (You)',  action: 'Paused a workspace',                   target: 'Kinetic Motors',               scope: 'Platform-wide' },
    { time: 'Yesterday · 11:30', actor: 'Leo Martins',  action: 'Scaled compute cluster',               target: 'eu-central-1 · 8 → 12 nodes',  scope: 'Frankfurt' },
    { time: '2 days ago',        actor: 'System',       action: 'Archived stale query results',         target: '18,420 results older than 13 months', scope: 'Platform-wide' },
    { time: '3 days ago',        actor: 'Admin (You)',  action: 'Changed the data retention rule',      target: 'Raw events · 24 → 18 months',  scope: 'Mumbai' },
    { time: '4 days ago',        actor: 'Aisha Rahman', action: 'Upgraded the plan',                    target: 'Northwind Retail → Enterprise', scope: 'Billing' }
  ];

  /* ---------- Compliance ---------- */
  const complianceChecks = [
    { name: 'Information security (ISO 27001)', state: 'clear',     detail: 'Surveillance audit passed · next review Mar 2027',      metric: 'Certified' },
    { name: 'Service controls (SOC 2 Type II)', state: 'clear',     detail: 'Report issued Aug 2026 · no exceptions noted',           metric: 'Type II' },
    { name: 'Data protection (GDPR)',           state: 'clear',     detail: 'EU customer data stays in eu-central-1',                metric: '42 DPAs' },
    { name: 'Health data (HIPAA)',              state: 'clear',     detail: 'Veda Health workspace encrypted with customer keys',    metric: 'BAA signed' },
    { name: 'Quarterly access reviews',         state: 'attention', detail: '14 inactive admin accounts not reviewed this quarter',   metric: '14 accounts' }

  const stateClass = {

    'Suspended': 'bad', 'Pending': 'info', 'Paid': 'good', 'Sent': 'info', 'Overdue': 'bad',
    'Connected': 'good', 'Degraded': 'warn', 'Clear': 'good', 'Attention': 'warn'

  /* =========================================================
     NAVIGATION
     ========================================================= */
  const navGroups = [
    { label: 'Platform', items: [
      { label: 'Overview',       id: 'dashboard',  icon: 'grid' },
      { label: 'Workspaces',     id: 'workspaces', icon: 'building' },
      { label: 'Users',          id: 'people',     icon: 'users' },
      { label: 'Infrastructure', id: 'regions',    icon: 'server' } ] },
    { label: 'Governance', items: [

      { label: 'Integrations',   id: 'systems',    icon: 'plug' },
      { label: 'Billing',        id: 'billing',    icon: 'invoice' } ] },
    { label: 'Controls', items: [
      { label: 'Security',       id: 'security',   icon: 'lock' },

  const pageMap = {
    dashboard:  { title: 'Overview',       sub: 'How the platform is running across workspaces, users and regions' },
    workspaces: { title: 'Workspaces',     sub: 'Every customer workspace, plan and renewal date' },
    people:     { title: 'Users',          sub: 'Who can open what, and when they were last in' },
    regions:    { title: 'Infrastructure', sub: 'Regions, storage capacity and query load' },
    audit:      { title: 'Audit log',      sub: 'Every administrative and system action, newest first' },
    compliance: { title: 'Compliance',     sub: 'Certifications, standards and standing checks' },

  const pageActions = {

  /* =========================================================
     SIGNED-IN USER (from login page → localStorage "user")
     ========================================================= */
  const EMAIL_RE = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
  const USER_KEYS = ['user', 'currentUser', 'loggedInUser', 'authUser', 'userData', 'profile', 'account', 'session', 'userEmail', 'email'];
  let foundUserKey = null;

  function asEmail(v) { return typeof v === 'string' && EMAIL_RE.test(v.trim()) ? v.trim() : null; }
  function findEmailIn(obj, depth) {
    if (!obj || depth > 4) return null;
    if (typeof obj === 'string') {
      const e = asEmail(obj); if (e) return { email: e };
      try { return findEmailIn(JSON.parse(obj), depth + 1); } catch (err) { return null; }
    }
    if (typeof obj !== 'object') return null;
    for (const k in obj) { const e = asEmail(obj[k]); if (e) return Object.assign({}, obj, { email: e }); }
    for (const k in obj) { const hit = findEmailIn(obj[k], depth + 1); if (hit) return Object.assign({}, obj, hit); }
    return null;
  }
  function getCurrentUser() {
    const stores = [];
    try { stores.push(localStorage); } catch (e) {}
    try { stores.push(sessionStorage); } catch (e) {}
    for (const s of stores) { try { if (s.getItem('isAuthenticated') === 'false') return null; } catch (e) {} }
    for (const s of stores) {
      for (const key of USER_KEYS) {
        let hit = null;
        try { hit = findEmailIn(s.getItem(key), 0); } catch (e) {}
        if (hit) { foundUserKey = key; return hit; }
      }
    }
    return null;
  }

  const currentUser = getCurrentUser();
  const currentEmail = currentUser ? currentUser.email : '';
  const storedName = currentUser && typeof currentUser.name === 'string' ? currentUser.name : '';
  const currentUsername = storedName || (currentEmail ? currentEmail.split('@')[0] : '');
  const currentInitial = ((currentUsername || currentEmail || '?').charAt(0) || '?').toUpperCase();
  const currentRole = currentUser ? (currentUser.role === 'admin' ? 'Administrator' : 'Analyst') : 'Not signed in';

  function paintUserChrome() {
    const name = currentUsername || 'Signed out';
    const email = currentEmail || '—';
    document.querySelectorAll('#sidebar-user-avatar, #topbar-user-avatar').forEach(el => el.textContent = currentInitial);
    const sName = document.getElementById('sidebar-user-name');
    sName.textContent = name; sName.title = name;
    const sEmail = document.getElementById('sidebar-user-email');
    sEmail.textContent = email; sEmail.title = email;
    document.getElementById('topbar-user-name').textContent = name;
    document.getElementById('topbar-user-email').textContent = email;
    document.getElementById('topbar-user-role').textContent = currentRole;
  }

  function logout() {
    const keys = ['user', 'isAuthenticated', 'activeNav', 'adminNav', 'settings', 'adminSettings'].concat(USER_KEYS);
    if (foundUserKey && keys.indexOf(foundUserKey) === -1) keys.push(foundUserKey);
    keys.forEach(k => {
      try { localStorage.removeItem(k); } catch (e) {}
      try { sessionStorage.removeItem(k); } catch (e) {}
    });
    window.location.href = 'login.html';
  }

  /* =========================================================
     STATE  (stored under admin-only keys so it never clashes
     with the user dashboard's saved page and settings)
     ========================================================= */
  function readStore(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function writeStore(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function loadSettings() {
    const d = {
      usageAlerts: true, weeklyDigest: false, compactRows: false, language: 'English',
      twoFactor: true, ssoRequired: true, ipAllowlist: false, workspaceWalls: true, sessionTimeout: '30 minutes'
    };
    try { const raw = readStore('adminSettings'); if (raw) return Object.assign(d, JSON.parse(raw)); } catch (e) {}
    return d;
  }
  function saveSettings() { writeStore('adminSettings', JSON.stringify(state.settings)); }

  const savedNav = readStore('adminNav');
  let state = {
    activeNav: savedNav && pageMap[savedNav] ? savedNav : 'dashboard',
    wsFilter: 'All',
    peopleSearch: '',
    settings: loadSettings()
  };

  function money(n) { return '$' + n.toLocaleString(); }
  function moneyShort(n) { return n >= 1000000 ? '$' + (n / 1000000).toFixed(2) + 'm' : '$' + Math.round(n / 1000) + 'k'; }
  function go404() { window.location.href = '404.html'; }
  function planTag(p) { return `<span class="tag" style="--c:${planColor[p] || '#38bdf8'}">${p}</span>`; }
  function pill(text) { return `<span class="state state-${stateClass[text] || 'muted'}">${text}</span>`; }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function initials(n) { return n.split(' ').map(p => p[0]).join('').slice(0, 2); }

  let toastTimer = null;
  function toast(msg, kind) {
    const t = document.getElementById('toast');
    t.innerHTML = `${ico(kind === 'no' ? 'x' : 'check')}<span>${esc(msg)}</span>`;
    t.className = 'toast show ' + (kind === 'no' ? 'toast-no' : 'toast-yes');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  /* =========================================================
     SHARED PIECES
     ========================================================= */
  function kpiRow(items) {
    return `<section class="kpis">${items.map((k, i) => `
      <article class="kpi anim" style="--c:${k.color || '#38bdf8'};--i:${i}" onclick="go404()">
        <div class="kpi-top">
          <span class="kpi-ico">${ico(k.icon || 'grid')}</span>
          ${k.trend ? `<span class="kpi-trend ${k.trend.good === false ? 'trend-bad' : 'trend-good'}">${k.trend.dir === 'up' ? '▲' : '▼'} ${k.trend.text}</span>` : ''}
        </div>
        <span class="kpi-value" data-count>${k.value}</span>
        <span class="kpi-label">${k.label}</span>
        ${k.note ? `<span class="kpi-note">${k.note}</span>` : ''}
      </article>`).join('')}</section>`;
  }
  let cardIndex = 0;
  function card(o, body) {
    return `<section class="card anim ${o.cls || ''}" style="--i:${cardIndex++ + 2}">
      <header class="card-head">
        <div>
          ${o.kicker ? `<span class="card-kicker">${o.kicker}</span>` : ''}
          <h2>${ico(o.icon || 'grid', 'head-ico')}${o.title}</h2>
          ${o.sub ? `<p${o.subId ? ` id="${o.subId}"` : ''}>${o.sub}</p>` : ''}
        </div>
        ${o.aside || ''}
      </header>
      ${body}
    </section>`;
  }
  function ring(pct, color, label) {
    const r = 34, c = 2 * Math.PI * r;
    return `<div class="ring">
      <svg viewBox="0 0 80 80" aria-hidden="true">
        <circle cx="40" cy="40" r="${r}" class="ring-bg"/>
        <circle cx="40" cy="40" r="${r}" class="ring-fg" stroke="${color}" stroke-dasharray="${c.toFixed(1)}" style="stroke-dashoffset:${c.toFixed(1)}" data-dash="${(c * (1 - pct / 100)).toFixed(1)}"/>
      </svg>
      <span class="ring-val">${pct}%</span>
      ${label ? `<span class="ring-label">${label}</span>` : ''}
    </div>`;
  }
  function trailHtml(list) {
    return list.map((a, i) => `
      <li class="trail-item row-anim" style="--r:${i}" onclick="go404()">
        <span class="trail-dot ${a.actor === 'System' ? 'auto' : a.actor === 'Admin (You)' ? 'you' : ''}"></span>
        <span class="trail-body">
          <span class="trail-line"><b>${esc(a.actor)}</b> ${esc(a.action.toLowerCase())} — ${esc(a.target)}</span>
          <span class="trail-meta">${a.time} · ${a.scope}</span>
        </span>
      </li>`).join('');
  }

  function afterRender() {
    requestAnimationFrame(() => {
      document.querySelectorAll('[data-w]').forEach(el => el.style.width = el.dataset.w + '%');
      document.querySelectorAll('[data-dash]').forEach(el => el.style.strokeDashoffset = el.dataset.dash);
    });
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.querySelectorAll('[data-count]').forEach(el => {
      const raw = el.textContent.trim();
      const m = raw.match(/^([^\d]*)([\d,]+\.?\d*)(.*)$/);
      if (!m) return;
      const prefix = m[1], numStr = m[2].replace(/,/g, ''), suffix = m[3];
      const target = parseFloat(numStr);
      const decimals = numStr.includes('.') ? numStr.split('.')[1].length : 0;
      const start = performance.now(), dur = 1100;
      function tick(now) {
        const p = Math.min(1, (now - start) / dur);
        const val = target * (1 - Math.pow(1 - p, 3));
        el.textContent = prefix + (decimals ? val.toFixed(decimals) : Math.round(val).toLocaleString()) + suffix;
        if (p < 1) requestAnimationFrame(tick); else el.textContent = raw;
      }
      requestAnimationFrame(tick);
    });
  }

  /* =========================================================
     OVERVIEW
     ========================================================= */
  function approvalsHtml(animate) {
    if (animate === undefined) animate = true;
    if (!approvals.length) return `<div class="empty empty--done">${ico('check')}<span>No requests waiting. Nice.</span></div>`;
    return `<ul class="approvals">${approvals.map((r, i) => `
      <li class="approval ${animate ? 'row-anim' : ''}" style="--r:${i}" data-req="${r.id}">
        <span class="avatar sm">${initials(r.who)}</span>
        <span class="approval-body">
          <span class="approval-who">${r.who} <em>${r.where}</em></span>
          <span class="approval-what">${r.what}</span>
          <span class="approval-when">${r.id} · ${r.when}</span>
        </span>
        <span class="approval-actions">
          <button class="act act-yes" data-approve="${r.id}" aria-label="Approve ${r.id}" title="Approve">${ico('check')}</button>
          <button class="act act-no" data-decline="${r.id}" aria-label="Decline ${r.id}" title="Decline">${ico('x')}</button>
        </span>
      </li>`).join('')}</ul>`;
  }

  function renderDashboard() {
    const mrr = invoices.reduce((a, b) => a + b.monthly, 0);
    const storage = regions.reduce((a, r) => a + r.storage, 0);
    const capacity = regions.reduce((a, r) => a + r.capacity, 0);
    const live = workspaces.filter(w => w.status === 'Active' || w.status === 'Pilot').length;

    const kpis = kpiRow([
      { label: 'Live workspaces',     value: String(live),     icon: 'building', trend: { dir: 'up', text: '1 pilot' }, note: 'of ' + workspaces.length + ' total' },
      { label: 'Platform users',      value: '12,480',         icon: 'users',    trend: { dir: 'up', text: '6.2%' }, note: 'across 4 regions', color: '#22d3ee' },
      { label: 'Monthly recurring revenue', value: money(mrr), icon: 'dollar',   trend: { dir: 'up', text: '9.8%' }, note: '7 invoices this cycle', color: '#a78bfa' },
      { label: 'Storage used',        value: Math.round(storage / capacity * 100) + '%', icon: 'db', note: storage + ' of ' + capacity + ' TB', color: '#fbbf24' }
    ]);

    const top = workspaces.filter(w => w.arrYtd > 0).sort((a, b) => b.arrYtd - a.arrYtd);
    const max = top[0].arrYtd;
    const revenue = top.map((w, i) => `
      <div class="rev row-anim" style="--r:${i}" onclick="go404()">
        <div class="rev-top"><span class="rev-name">${w.name}</span><span class="rev-val">${moneyShort(w.arrYtd)}</span></div>
        <div class="rev-track"><div class="rev-fill" data-w="${(w.arrYtd / max * 100).toFixed(1)}" style="--c:${planColor[w.plan]}"></div></div>
      </div>`).join('');
    const legend = Object.keys(planColor).map(p => `<li><i style="background:${planColor[p]}"></i>${p}</li>`).join('');

    const regionMinis = regions.map((r, i) => {
      const pct = Math.round(r.storage / r.capacity * 100);
      return `<div class="site-mini row-anim" style="--r:${i}" onclick="go404()">
        ${ring(pct, pct >= 90 ? '#fbbf24' : '#38bdf8')}
        <span class="site-mini-city">${r.city}</span>
        <span class="site-mini-sub">${r.storage} / ${r.capacity} TB</span>
      </div>`;
    }).join('');

    const checks = complianceChecks.map((c, i) => {
      const ok = c.state === 'clear';
      return `<li class="check-mini row-anim" style="--r:${i}" onclick="go404()">
        <span class="check-ico ${ok ? 'ok' : 'warn'}">${ico(ok ? 'check' : 'alert')}</span>
        <span class="check-mini-name">${c.name}</span>
        <span class="check-mini-metric">${c.metric}</span>
      </li>`;
    }).join('');

    const renewals = workspaces.filter(w => /2026/.test(w.renewal)).map((w, i) => `
      <li class="renew row-anim" style="--r:${i}" onclick="go404()">
        <span class="renew-date"><b>${w.renewal.split(' ')[0]}</b><em>${w.renewal.split(' ')[1]}</em></span>
        <span class="renew-body"><span class="renew-name">${w.name}</span><span class="renew-sub">${w.plan} · ${w.seats} seats</span></span>
        ${pill(w.status)}
      </li>`).join('');

    return `${kpis}
      <div class="grid grid-a">
        ${card({ kicker: 'Revenue', title: 'Revenue by workspace', sub: 'Year to date · bar colour shows the plan', icon: 'dollar', cls: 'span-2', aside: `<ul class="legend">${legend}</ul>` }, `<div class="rev-list">${revenue}</div>`)}
        ${card({ kicker: 'Action', title: 'Access requests', sub: 'Approve or decline — it’s logged either way', icon: 'users', aside: `<span class="count-badge" id="approval-count">${approvals.length}</span>` }, `<div id="approvals-box">${approvalsHtml()}</div>`)}
      </div>
      <div class="grid grid-b">
        ${card({ kicker: 'Capacity', title: 'Storage by region', sub: 'Amber means a region is 90% full or more', icon: 'server', aside: `<button class="link-btn" data-nav="regions">All regions →</button>` }, `<div class="site-minis">${regionMinis}</div>`)}
        ${card({ kicker: 'Assurance', title: 'Compliance', sub: 'Standards the platform is held to', icon: 'shield', aside: `<button class="link-btn" data-nav="compliance">Details →</button>` }, `<ul class="check-minis">${checks}</ul>`)}
      </div>
      <div class="grid grid-c">
        ${card({ kicker: 'Contracts', title: 'Renewals due this year', sub: 'Start conversations 60 days out', icon: 'invoice' }, `<ul class="renew-list">${renewals}</ul>`)}
        ${card({ kicker: 'Log', title: 'Recent activity', sub: 'Latest entries on the audit log', icon: 'log', aside: `<button class="link-btn" data-nav="audit">Full log →</button>` }, `<ul class="trail" id="overview-trail">${trailHtml(auditTrail.slice(0, 5))}</ul>`)}
      </div>`;
  }

  /* =========================================================
     WORKSPACES
     ========================================================= */
  function renderWorkspaces() {
    const filters = ['All', 'Active', 'Pilot', 'At risk', 'Trial', 'Paused'];
    const list = state.wsFilter === 'All' ? workspaces : workspaces.filter(w => w.status === state.wsFilter);
    const total = workspaces.reduce((a, w) => a + w.arrYtd, 0);
    const max = Math.max(...workspaces.map(w => w.arrYtd));
    const kpis = kpiRow([
      { label: 'Workspaces',   value: String(workspaces.length), icon: 'building' },
      { label: 'Seats sold',   value: fmtN(workspaces.reduce((a, w) => a + w.seats, 0)), icon: 'users', color: '#22d3ee' },
      { label: 'Revenue YTD',  value: money(total), icon: 'dollar', color: '#a78bfa' },
      { label: 'At risk',      value: String(workspaces.filter(w => w.status === 'At risk').length), icon: 'alert', color: '#fbbf24', note: 'renewal in October' }
    ]);
    const rows = list.map((w, i) => `
      <tr class="row-anim" style="--r:${i}" onclick="go404()">
        <td class="stack" data-label="Workspace"><span class="t-name">${w.name}</span><span class="t-sub">Customer since ${w.since}</span></td>
        <td data-label="Plan">${planTag(w.plan)}</td>
        <td class="mono" data-label="Seats">${w.seats}</td>
        <td data-label="Revenue YTD"><div class="mini"><span class="mini-track"><span class="mini-fill good" data-w="${max ? Math.round(w.arrYtd / max * 100) : 0}"></span></span><span class="mini-num">${money(w.arrYtd)}</span></div></td>
        <td data-label="Renewal">${w.renewal}</td>
        <td data-label="Status">${pill(w.status)}</td>
      </tr>`).join('');
    return `${kpis}${card({ kicker: 'Register', title: 'Workspace register', sub: 'Plans, seats and revenue to date', icon: 'building', cls: 'card-table',
        aside: `<div class="chip-row">${filters.map(f => `<button class="chip ws-filter ${state.wsFilter === f ? 'chip-on' : ''}" data-filter="${f}">${f}</button>`).join('')}</div>` },
      `<div class="table-wrap"><table class="table">
        <thead><tr><th>Workspace</th><th>Plan</th><th>Seats</th><th>Revenue YTD</th><th>Renewal</th><th>Status</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" class="empty">No workspaces in that state.</td></tr>'}</tbody>
      </table></div>`)}`;
  }
  function fmtN(n) { return n.toLocaleString(); }

  /* =========================================================
     USERS — every word typed must match somewhere in the row.
     Typing swaps only the rows and the count line, so the
     caret stays put.
     ========================================================= */
  function peopleTerms() { return state.peopleSearch.toLowerCase().split(/\s+/).filter(Boolean); }
  function peopleList() {
    const terms = peopleTerms();
    if (!terms.length) return people.slice();
    return people.filter(p => {
      const hay = [p.name, p.role, p.workspace, p.access, p.lastActive, p.status].join(' ').toLowerCase();
      return terms.every(t => hay.includes(t));
    });
  }
  function peopleRowsHtml(list, animate) {
    if (!list.length) return '<tr><td colspan="5" class="empty">Nobody matches that search.</td></tr>';
    return list.map((p, i) => `
      <tr class="${animate ? 'row-anim' : ''}" style="--r:${i}" onclick="go404()">
        <td class="stack" data-label="Name"><span class="t-name"><span class="avatar xs">${initials(p.name)}</span>${p.name}</span><span class="t-sub">${p.role}</span></td>
        <td data-label="Workspace">${p.workspace}</td>
        <td data-label="Access"><span class="tag" style="--c:${accessColor[p.access]}">${p.access}</span></td>
        <td data-label="Last active">${p.lastActive}</td>
        <td data-label="Status">${pill(p.status)}</td>
      </tr>`).join('');
  }
  function peopleSubText(list) {
    return peopleTerms().length ? `Showing ${list.length} of ${people.length} users` : 'Who can open what, and when they were last in';
  }
  function updatePeopleRows() {
    const body = document.getElementById('people-rows');
    if (!body) return;
    const list = peopleList();
    body.innerHTML = peopleRowsHtml(list, false);
    const sub = document.getElementById('people-sub');
    if (sub) sub.textContent = peopleSubText(list);
  }
  function renderPeople() {
    const list = peopleList();
    const kpis = kpiRow([
      { label: 'Users with a login', value: '12,480', icon: 'users' },
      { label: 'Admins & owners',    value: String(people.filter(p => p.access === 'Admin' || p.access === 'Owner').length), icon: 'shield', color: '#22d3ee' },
      { label: 'Pending invites',    value: String(people.filter(p => p.status === 'Pending').length), icon: 'plus', color: '#a78bfa' },
      { label: 'Suspended',          value: String(people.filter(p => p.status === 'Suspended').length), icon: 'lock', color: '#f87171' }
    ]);
    return `${kpis}${card({ kicker: 'Access', title: 'Users and access', sub: peopleSubText(list), subId: 'people-sub', icon: 'users', cls: 'card-table',
        aside: `<label class="finder finder-inline">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg>
          <input id="user-search-input" placeholder="Name, workspace, access, status…" value="${esc(state.peopleSearch)}">
        </label>` },
      `<div class="table-wrap"><table class="table">
        <thead><tr><th>Name</th><th>Workspace</th><th>Access</th><th>Last active</th><th>Status</th></tr></thead>
        <tbody id="people-rows">${peopleRowsHtml(list, true)}</tbody>
      </table></div>`)}`;
  }

      </table></div>`)}`;
  }

  /* =========================================================
     SECURITY
     ========================================================= */
  function switchHtml(id, value) {
    return `<span class="switch ${value ? 'on' : ''}" data-toggle="${id}" role="switch" aria-checked="${value}" tabindex="0"><span class="switch-knob"></span></span>`;
  }
  function selectHtml(id, options, value) {
    return `<select class="pref-select" id="${id}">${options.map(o => `<option ${value === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
  }
  function renderSecurity() {
    const s = state.settings;
    return `<div class="grid grid-settings">
      ${card({ kicker: 'Policy', title: 'Access policy', sub: 'Applied to everyone with a login', icon: 'lock' },
        `<div class="pref"><div><span class="pref-title">Two-factor for admins and owners</span><span class="pref-desc">Required at every sign-in, no exceptions</span></div>${switchHtml('twoFactor', s.twoFactor)}</div>
        <div class="pref"><div><span class="pref-title">Single sign-on only</span><span class="pref-desc">Users sign in through the company identity provider</span></div>${switchHtml('ssoRequired', s.ssoRequired)}</div>
        <div class="pref"><div><span class="pref-title">IP allowlist</span><span class="pref-desc">Only allow sign-ins from approved office networks</span></div>${switchHtml('ipAllowlist', s.ipAllowlist)}</div>
        <div class="pref pref-last"><div><span class="pref-title">Workspace data walls</span><span class="pref-desc">Users only see the workspaces they are invited to</span></div>${switchHtml('workspaceWalls', s.workspaceWalls)}</div>`)}
      <div class="stack-col">
        ${card({ kicker: 'Sessions', title: 'Session policy', sub: 'How long an idle session stays signed in', icon: 'clock' },
          `<div class="pref pref-last"><div><span class="pref-title">Automatic sign-out</span><span class="pref-desc">Applies to every account</span></div>${selectHtml('timeout-select', ['15 minutes', '30 minutes', '1 hour', '4 hours'], s.sessionTimeout)}</div>`)}
        ${card({ kicker: 'Danger', title: 'Platform-wide actions', sub: 'These take effect immediately for everyone', icon: 'alert' },
          `<div class="danger-row"><button class="chip chip-danger" onclick="go404()">Sign out every session</button><button class="chip chip-danger" onclick="go404()">Rotate system keys</button></div>`)}
      </div>
    </div>`;
  }

  /* =========================================================
     SETTINGS
     ========================================================= */
  function renderSettings() {
    const s = state.settings;
    const displayName = currentUsername || 'Signed out';
    const displayEmail = currentEmail || 'No account signed in';
    return `<div class="grid grid-settings">
      ${card({ kicker: 'Profile', title: 'Account', sub: 'The profile signed in on this device', icon: 'users' },
        `<div class="account">
          <span class="avatar avatar--admin lg">${currentInitial}</span>
          <div>
            <span class="account-name">${esc(displayName)}</span>
            <span class="account-email">${esc(displayEmail)}</span>
            <span class="account-role">${currentRole}</span>
          </div>
        </div>
        <button class="chip" onclick="go404()">Edit profile</button>`)}

      ${card({ kicker: 'Preferences', title: 'Preferences', sub: 'Alerts and how the console reads', icon: 'gear' },
        `<div class="pref"><div><span class="pref-title">Usage spike alerts</span><span class="pref-desc">Notify me when a workspace’s query load jumps</span></div>${switchHtml('usageAlerts', s.usageAlerts)}</div>
        <div class="pref"><div><span class="pref-title">Monday digest</span><span class="pref-desc">A summary of billing, renewals and access changes</span></div>${switchHtml('weeklyDigest', s.weeklyDigest)}</div>
        <div class="pref"><div><span class="pref-title">Compact rows</span><span class="pref-desc">Tighter spacing in the register tables</span></div>${switchHtml('compactRows', s.compactRows)}</div>
        <div class="pref pref-last"><div><span class="pref-title">Language</span><span class="pref-desc">Interface display language</span></div>${selectHtml('lang-select', ['English', 'French', 'Spanish', 'Hindi', 'Telugu'], s.language)}</div>`)}

      ${card({ kicker: 'Session', title: 'Session', sub: 'Sign out of this account on this device', icon: 'lock' },
        `<div class="session"><p>Signed in as <strong>${esc(displayEmail)}</strong>. Signing out clears the session and returns you to the sign-in screen.</p>
        <button class="chip chip-danger" id="settings-logout-btn">Sign out</button></div>`)}

      ${card({ kicker: 'Danger', title: 'Account actions', sub: 'These cannot be undone', icon: 'alert' },
        `<div class="danger-row"><button class="chip chip-danger" onclick="go404()">Reset password</button><button class="chip chip-danger" onclick="go404()">Close account</button></div>`)}
    </div>`;
  }

  const pageRenderers = {
    dashboard: renderDashboard, workspaces: renderWorkspaces, people: renderPeople, regions: renderRegions,
    audit: renderAudit, compliance: renderCompliance, systems: renderSystems, billing: renderBilling,
    security: renderSecurity, settings: renderSettings
  };

  /* =========================================================
     SHELL
     ========================================================= */
  function badgeFor(id) {
    if (id === 'dashboard' && approvals.length) return `<span class="nav-badge nav-badge--info">${approvals.length}</span>`;
    if (id === 'workspaces') { const n = workspaces.filter(w => w.status === 'At risk').length; return n ? `<span class="nav-badge nav-badge--warn">${n}</span>` : ''; }
    if (id === 'compliance') { const n = complianceChecks.filter(c => c.state !== 'clear').length; return n ? `<span class="nav-badge">${n}</span>` : ''; }
    if (id === 'billing')    { const n = invoices.filter(b => b.state === 'Overdue').length; return n ? `<span class="nav-badge">${n}</span>` : ''; }
    return '';
  }
  function renderNav() {
    document.getElementById('nav-drawer').innerHTML = navGroups.map(g => `
      <p class="dock-label">${g.label}</p>
      <nav class="dock-nav">${g.items.map(i => `<button class="dock-item ${state.activeNav === i.id ? 'on' : ''}" data-nav="${i.id}">${ico(i.icon, 'dock-ico')}<span class="dock-text">${i.label}</span>${badgeFor(i.id)}</button>`).join('')}</nav>`).join('');
    document.querySelector('#notif-btn .icon-dot').style.display = approvals.length ? '' : 'none';
  }

  function renderPage(animate) {
    const page = pageMap[state.activeNav];
    const group = navGroups.find(g => g.items.some(i => i.id === state.activeNav));
    document.getElementById('page-title-text').textContent = page.title;
    document.getElementById('page-sub-text').textContent = page.sub;
    document.getElementById('page-kicker').textContent = 'Admin console · ' + (group ? group.label : '');
    document.getElementById('page-actions').innerHTML = pageActions[state.activeNav] || '';
    document.title = page.title + ' – Admin Console';
    cardIndex = 0;
    const content = document.getElementById('content-area');
    content.innerHTML = pageRenderers[state.activeNav]();
    content.classList.toggle('no-anim', animate === false);
    document.body.classList.toggle('compact', !!state.settings.compactRows);
    renderNav();
    const sBtn = document.getElementById('settings-logout-btn');
    if (sBtn) sBtn.addEventListener('click', logout);
    if (animate !== false) {
      window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
      const head = document.querySelector('.page-head');
      head.classList.remove('anim'); void head.offsetWidth; head.classList.add('anim');
      afterRender();
    } else {
      document.querySelectorAll('[data-w]').forEach(el => el.style.width = el.dataset.w + '%');
      document.querySelectorAll('[data-dash]').forEach(el => el.style.strokeDashoffset = el.dataset.dash);
    }
  }

  function navigateTo(id) {
    if (!pageMap[id]) return;
    state.activeNav = id;
    writeStore('adminNav', id);
    closeDrawer();
    closeWhoami();
    renderPage();
  }

  /* ---- access requests: approve / decline ---- */
  function resolveRequest(id, approved) {
    const req = approvals.find(r => r.id === id);
    if (!req) return;
    const row = document.querySelector('[data-req="' + id + '"]');
    function finish() {
      approvals = approvals.filter(r => r.id !== id);
      auditTrail.unshift({
        time: 'Just now', actor: 'Admin (You)',
        action: approved ? 'Approved an access request' : 'Declined an access request',
        target: req.who + ' — ' + req.what, scope: req.where
      });
      const box = document.getElementById('approvals-box');
      if (box) box.innerHTML = approvalsHtml(false);
      const count = document.getElementById('approval-count');
      if (count) count.textContent = approvals.length;
      const trail = document.getElementById('overview-trail');
      if (trail) { trail.innerHTML = trailHtml(auditTrail.slice(0, 5)); trail.querySelectorAll('.row-anim').forEach(el => el.style.animationDelay = '0s'); }
      renderNav();
      toast((approved ? 'Approved ' : 'Declined ') + id + ' for ' + req.who, approved ? 'yes' : 'no');
    }
    if (row && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      row.style.height = row.offsetHeight + 'px';
      row.classList.add(approved ? 'is-yes' : 'is-no');
      requestAnimationFrame(() => row.classList.add('leaving'));
      setTimeout(finish, 420);
    } else {
      finish();
    }
  }

  /* ---- sidebar: fixed on desktop, drawer at 1100px and below ---- */
  const MENU_BREAK = 1100;
  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('scrim');
  const burger = document.getElementById('hamburger-btn');

  function openDrawer() {
    sidebar.classList.add('open');
    scrim.classList.add('show');
    burger.classList.add('is-open');
    burger.setAttribute('aria-expanded', 'true');
    burger.setAttribute('aria-label', 'Close menu');
    document.body.classList.add('nav-open');
  }
  function closeDrawer() {
    if (!sidebar.classList.contains('open')) return;
    sidebar.classList.remove('open');
    scrim.classList.remove('show');
    burger.classList.remove('is-open');
    burger.setAttribute('aria-expanded', 'false');
    burger.setAttribute('aria-label', 'Open menu');
    document.body.classList.remove('nav-open');
  }
  function syncDock() {
    const fixed = window.innerWidth > MENU_BREAK;
    if (fixed) closeDrawer();
    sidebar.setAttribute('aria-hidden', fixed || sidebar.classList.contains('open') ? 'false' : 'true');
  }
  burger.addEventListener('click', () => sidebar.classList.contains('open') ? closeDrawer() : openDrawer());
  document.getElementById('dock-close').addEventListener('click', closeDrawer);
  scrim.addEventListener('click', closeDrawer);
  window.addEventListener('resize', syncDock);
  syncDock();

  /* ---- user menu ---- */
  const whoami = document.getElementById('topbar-user');
  const whoamiBtn = document.getElementById('topbar-user-btn');
  function closeWhoami() { whoami.classList.remove('open'); whoamiBtn.setAttribute('aria-expanded', 'false'); }
  whoamiBtn.addEventListener('click', e => {
    e.stopPropagation();
    const open = whoami.classList.toggle('open');
    whoamiBtn.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', e => { if (!whoami.contains(e.target)) closeWhoami(); });

  document.getElementById('notif-btn').addEventListener('click', () => navigateTo('dashboard'));
  document.getElementById('logout-btn').addEventListener('click', logout);
  document.getElementById('topbar-logout-btn').addEventListener('click', logout);

  /* ---- top bar search: on phones the magnifier opens the field first ---- */
  const finder = document.getElementById('topbar-search');
  const finderInput = document.getElementById('topbar-search-input');
  function openFinder() { finder.classList.add('expanded'); finderInput.focus(); }
  finder.addEventListener('submit', e => {
    e.preventDefault();
    if (window.innerWidth <= 720 && !finder.classList.contains('expanded')) { openFinder(); return; }
    if (!finderInput.value.trim()) { finderInput.focus(); return; }
    go404();
  });
  finderInput.addEventListener('blur', () => { if (!finderInput.value.trim()) finder.classList.remove('expanded'); });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeDrawer(); closeWhoami(); finderInput.blur(); }
    const typing = e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
    if (e.key === '/' && !typing) { e.preventDefault(); openFinder(); }
  });

  /* ---- delegated clicks ---- */
  document.addEventListener('click', e => {
    const yes = e.target.closest('[data-approve]');
    if (yes) { resolveRequest(yes.dataset.approve, true); return; }
    const no = e.target.closest('[data-decline]');
    if (no) { resolveRequest(no.dataset.decline, false); return; }
    const navBtn = e.target.closest('[data-nav]');
    if (navBtn) { navigateTo(navBtn.getAttribute('data-nav')); return; }
    const wf = e.target.closest('.ws-filter');
    if (wf) { state.wsFilter = wf.dataset.filter; renderPage(false); return; }
    const toggle = e.target.closest('[data-toggle]');
    if (toggle) { flipSwitch(toggle); return; }
  });
  document.addEventListener('keydown', e => {
    const toggle = e.target.closest && e.target.closest('[data-toggle]');
    if (toggle && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); flipSwitch(toggle); }
  });
  function flipSwitch(toggle) {
    const key = toggle.dataset.toggle;
    state.settings[key] = !state.settings[key];
    saveSettings();
    toggle.classList.toggle('on', state.settings[key]);
    toggle.setAttribute('aria-checked', String(state.settings[key]));
    if (key === 'compactRows') document.body.classList.toggle('compact', state.settings[key]);
    toast((state.settings[key] ? 'Turned on: ' : 'Turned off: ') + toggle.closest('.pref').querySelector('.pref-title').textContent, state.settings[key] ? 'yes' : 'no');
  }
  document.addEventListener('input', e => {
    if (e.target && e.target.id === 'user-search-input') { state.peopleSearch = e.target.value; updatePeopleRows(); }
  });
  document.addEventListener('change', e => {
    if (!e.target) return;
    if (e.target.id === 'lang-select')    { state.settings.language = e.target.value; saveSettings(); }
    if (e.target.id === 'timeout-select') { state.settings.sessionTimeout = e.target.value; saveSettings(); toast('Automatic sign-out set to ' + e.target.value, 'yes'); }
  });

  /* ---- boot ---- */
  paintUserChrome();
  renderPage();
  </script>
</body>
</html>
