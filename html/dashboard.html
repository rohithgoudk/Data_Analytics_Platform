    </div>

    <div class="head-right">
      <form class="finder" id="topbar-search" autocomplete="off" role="search">

  /* =========================================================
     SIGNED-IN USER (from login page → localStorage "user")
     Checks the usual key names in localStorage then
     sessionStorage; accepts a JSON object or a bare email.
     ========================================================= */
  const EMAIL_RE = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
  const USER_KEYS = ['user', 'currentUser', 'loggedInUser', 'authUser', 'userData', 'profile', 'account', 'session', 'userEmail', 'email'];
  let foundUserKey = null;

  function asEmail(v) { return typeof v === 'string' && EMAIL_RE.test(v.trim()) ? v.trim() : null; }
  function findEmailIn(obj, depth) {
    if (!obj || depth > 4) return null;
    if (typeof obj === 'string') {
      const e = asEmail(obj); if (e) return { email: e };
      try { return findEmailIn(JSON.parse(obj), depth + 1); } catch (err) { return null; }
    }
    if (typeof obj !== 'object') return null;
    for (const k in obj) { const e = asEmail(obj[k]); if (e) return Object.assign({}, obj, { email: e }); }
    for (const k in obj) { const hit = findEmailIn(obj[k], depth + 1); if (hit) return Object.assign({}, obj, hit); }
    return null;
  }
  function getCurrentUser() {
    const stores = [];
    try { stores.push(localStorage); } catch (e) {}
    try { stores.push(sessionStorage); } catch (e) {}
    for (const s of stores) { try { if (s.getItem('isAuthenticated') === 'false') return null; } catch (e) {} }
    for (const s of stores) {
      for (const key of USER_KEYS) {
        let hit = null;
        try { hit = findEmailIn(s.getItem(key), 0); } catch (e) {}
        if (hit) { foundUserKey = key; return hit; }
      }
    }
    return null;
  }

  const currentUser = getCurrentUser();
  const currentEmail = currentUser ? currentUser.email : '';
  const storedName = currentUser && typeof currentUser.name === 'string' ? currentUser.name : '';
  const currentUsername = storedName || (currentEmail ? currentEmail.split('@')[0] : '');
  const currentInitial = ((currentUsername || currentEmail || '?').charAt(0) || '?').toUpperCase();
  const currentRole = currentUser ? (currentUser.role === 'admin' ? 'Administrator' : 'Analyst') : 'Not signed in';

  function paintUserChrome() {
    const name = currentUsername || 'Signed out';
    const email = currentEmail || '—';
    document.querySelectorAll('#sidebar-user-avatar, #topbar-user-avatar').forEach(el => el.textContent = currentInitial);
    const sName = document.getElementById('sidebar-user-name');
    sName.textContent = name; sName.title = name;
    const sEmail = document.getElementById('sidebar-user-email');
    sEmail.textContent = email; sEmail.title = email;
    document.getElementById('topbar-user-name').textContent = name;
    document.getElementById('topbar-user-email').textContent = email;
    document.getElementById('topbar-user-role').textContent = currentRole;
  }

  function logout() {
    const keys = ['user', 'isAuthenticated', 'activeNav', 'settings'].concat(USER_KEYS);
    if (foundUserKey && keys.indexOf(foundUserKey) === -1) keys.push(foundUserKey);
    keys.forEach(k => {
      try { localStorage.removeItem(k); } catch (e) {}
      try { sessionStorage.removeItem(k); } catch (e) {}
    });
    window.location.href = 'login.html';
  }

  function loadSettings() {
    const d = { anomalyAlerts: true, weeklyDigest: false, compactRows: false, language: 'English', currency: 'USD ($)' };
    try { const raw = readStore('settings'); if (raw) return Object.assign(d, JSON.parse(raw)); } catch (e) {}
    return d;

  function kpiRow(items) {
    return `<section class="kpis">${items.map((k, i) => `
      <article class="kpi anim" style="--c:${k.color || '#38bdf8'};--i:${i}" onclick="go404()">
        <div class="kpi-top">
          <span class="kpi-ico">${ico(k.icon || 'pulse')}</span>
          ${k.trend ? `<span class="kpi-trend ${k.trend.good === false ? 'trend-bad' : 'trend-good'}">${k.trend.dir === 'up' ? '▲' : '▼'} ${k.trend.text}</span>` : ''}
        </div>
        <span class="kpi-value" data-count>${k.value}</span>
        <span class="kpi-label">${k.label}</span>
        ${k.bar !== undefined ? `<span class="kpi-track"><span class="kpi-fill" data-w="${k.bar}"></span></span>` : ''}
        ${k.note ? `<span class="kpi-note">${k.note}</span>` : ''}
      </article>`).join('')}</section>`;
  }
  let cardIndex = 0;
  function card(o, body) {
    return `<section class="card anim ${o.cls || ''}" style="--i:${cardIndex++ + 2}">
      <header class="card-head">
        <div><h2>${ico(o.icon || 'grid', 'head-ico')}${o.title}</h2>${o.sub ? `<p>${o.sub}</p>` : ''}</div>
        ${o.aside || ''}
      </header>
      ${body}
    </section>`;
  }
  function chips(list, current, cls) {
    return `<div class="chip-row">${list.map(c => `<button class="chip ${cls} ${current === c ? 'chip-on' : ''}" data-filter="${c}">${c}</button>`).join('')}</div>`;
  }
  function sparkline(data, color) {
    const max = Math.max(...data), min = Math.min(...data), w = 120, h = 36;
    const pts = data.map((v, i) => `${(i / (data.length - 1) * w).toFixed(1)},${(h - 4 - (v - min) / (max - min || 1) * (h - 8)).toFixed(1)}`).join(' ');
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <polyline points="0,${h} ${pts} ${w},${h}" fill="${color}" opacity=".12" stroke="none"/>
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    </svg>`;
  }

  /* After each render: fill bars, count up numbers */
  function afterRender() {
    requestAnimationFrame(() => {
      document.querySelectorAll('[data-w]').forEach(el => el.style.width = el.dataset.w + '%');
    });
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.querySelectorAll('[data-count]').forEach(el => {
      const raw = el.textContent.trim();
      const m = raw.match(/^([^\d]*)([\d,]+\.?\d*)(.*)$/);
      if (!m) return;
      const prefix = m[1], numStr = m[2].replace(/,/g, ''), suffix = m[3];
      const target = parseFloat(numStr);
      const decimals = numStr.includes('.') ? numStr.split('.')[1].length : 0;
      const start = performance.now(), dur = 1100;
      function tick(now) {
        const p = Math.min(1, (now - start) / dur);
        const eased = 1 - Math.pow(1 - p, 3);
        const val = target * eased;
        el.textContent = prefix + (decimals ? val.toFixed(decimals) : Math.round(val).toLocaleString()) + suffix;
        if (p < 1) requestAnimationFrame(tick); else el.textContent = raw;
      }
      requestAnimationFrame(tick);
    });
  }

  /* =========================================================
     OVERVIEW
     ========================================================= */
  function greeting() {
    const h = new Date().getHours();
    return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  }

  function revenueChart() {
    const W = 600, H = 220, top = 180;
    const x = i => (i / (months.length - 1)) * W;
    const y = v => H - (v / top) * H;
    const line = arr => arr.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const area = `0,${H} ${line(revenue)} ${W},${H}`;
    const grid = [0, 60, 120, 180].map(v => `<span class="rc-grid" style="bottom:${v / top * 100}%"><em>$${v}k</em></span>`).join('');
    const pos = i => (i / (months.length - 1) * 100).toFixed(2);
    const cols = months.map((m, i) => `<div class="rc-col" style="left:${pos(i)}%" tabindex="0" data-tip="${m} · $${revenue[i]}k this year · $${lastYear[i]}k last year"><span class="rc-dot" style="bottom:${revenue[i] / top * 100}%"></span></div>`).join('');
    const total = revenue.reduce((a, b) => a + b, 0), prev = lastYear.reduce((a, b) => a + b, 0);
    return `<div class="rc-legend">
        <span><i style="background:var(--primary)"></i>This year</span>
        <span><i class="dashed"></i>Last year</span>
      </div>
      <div class="rc" role="img" aria-label="Monthly revenue this year versus last year">
        <div class="rc-plot">
          ${grid}
          <svg class="rc-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
            <defs>
              <linearGradient id="rcFill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#38bdf8" stop-opacity=".35"/>
                <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="rcStroke" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/>
              </linearGradient>
            </defs>
            <polygon class="rc-area" points="${area}" fill="url(#rcFill)"/>
            <polyline class="rc-prev" points="${line(lastYear)}"/>
            <polyline class="rc-line" points="${line(revenue)}"/>
          </svg>
          <div class="rc-cols">${cols}</div>
        </div>
        <div class="rc-x">${months.map((m, i) => `<span style="left:${pos(i)}%">${m}</span>`).join('')}</div>
      </div>
      <div class="rc-foot">
        <span><b>$${fmt(total)}k</b> revenue this year</span>
        <span class="trend-good">▲ ${Math.round((total - prev) / prev * 100)}% vs last year</span>
      </div>`;
  }

  function trafficDonut() {
    let acc = 0;
    const stops = traffic.map(t => { const s = `${t.color} ${acc}% ${acc + t.v}%`; acc += t.v; return s; }).join(', ');
    return `<div class="donut-wrap">
        <div class="donut" style="--stops:${stops}" role="img" aria-label="Traffic by source">
          <div class="donut-hole"><b data-count>48,200</b><span>visitors</span></div>
        </div>
        <ul class="donut-legend">${traffic.map(t => `
          <li data-tip="${t.name}: ${t.v}% of visitors" tabindex="0"><i style="background:${t.color}"></i><span>${t.name}</span><b>${t.v}%</b></li>`).join('')}
        </ul>
      </div>`;
  }

  function funnelChart() {
    const first = funnel[0].n;
    return `<ul class="funnel">${funnel.map((f, i) => {
      const pct = f.n / first * 100;
      const stepConv = i ? Math.round(f.n / funnel[i - 1].n * 100) : 100;
      return `<li class="row-anim" style="--r:${i}">
        <div class="funnel-top"><span>${f.step}</span><span><b>${fmt(f.n)}</b>${i ? `<em>${stepConv}% of previous</em>` : ''}</span></div>
        <span class="funnel-track"><span class="funnel-fill" data-w="${pct.toFixed(1)}"></span></span>
      </li>`;
    }).join('')}</ul>`;
  }

  /* =========================================================
     QUERIES — every word typed must match somewhere in the row
     ========================================================= */
  function queryMatches(q, terms) {
    if (!terms.length) return true;
    const hay = [q.id, q.name, q.source, q.owner, q.status, q.last].join(' ').toLowerCase();
    return terms.every(w => hay.includes(w));
  }
  function renderQueries() {
    const terms = state.querySearch.toLowerCase().split(/\s+/).filter(Boolean);
    const list = queries.filter(q => queryMatches(q, terms));
    const kpis = kpiRow([
      { label: 'Saved queries',    value: String(queries.length), icon: 'code' },
      { label: 'Runs today',       value: '1,284', icon: 'play', color: '#22d3ee' },
      { label: 'Avg. runtime',     value: '3.1s', icon: 'clock', color: '#a78bfa' },
      { label: 'Failed',           value: String(queries.filter(q => q.status === 'Failed').length), icon: 'alert', color: '#f87171', note: 'need a fix' }
    ]);
    const rows = list.map((q, i) => `
      <tr class="row-anim" style="--r:${i}" onclick="go404()">
        <td class="mono" data-label="ID">${q.id}</td>
        <td class="stack" data-label="Query"><span class="t-name">${q.name}</span><span class="t-sub">${q.owner}</span></td>
        <td data-label="Source">${q.source}</td>
        <td class="mono" data-label="Runtime">${q.runtime}</td>
        <td data-label="Last run">${q.last}</td>

      </tr>`).join('');
    return `${kpis}${card({ title: 'Saved queries', sub: terms.length ? `Showing ${list.length} of ${queries.length}` : 'Most recently run first', icon: 'code', cls: 'card-table',
        aside: `<label class="finder finder-inline">

          <input id="query-search-input" placeholder="Name, source, owner, status…" value="${state.querySearch.replace(/"/g, '&quot;')}">
        </label>` },
      `<div class="table-wrap"><table class="table">
        <thead><tr><th>ID</th><th>Query</th><th>Source</th><th>Runtime</th><th>Last run</th><th>Status</th></tr></thead>

    const content = document.getElementById('content-area');
    content.innerHTML = pageRenderers[state.activeNav]();
    content.classList.toggle('no-anim', animate === false);
    document.body.classList.toggle('compact', !!state.settings.compactRows);
    renderNav();
    const sBtn = document.getElementById('settings-logout-btn');
    if (sBtn) sBtn.addEventListener('click', logout);
    if (animate !== false) {
      window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
      const head = document.querySelector('.page-head');
      head.classList.remove('anim'); void head.offsetWidth; head.classList.add('anim');
      afterRender();
    } else {
      document.querySelectorAll('[data-w]').forEach(el => el.style.width = el.dataset.w + '%');
    }
  }

  function navigateTo(id) {
    if (!pageMap[id]) return;
    state.activeNav = id;
    writeStore('activeNav', id);
    closeDrawer();
    closeWhoami();
    renderPage();
  }

  /* ---- sidebar: fixed on desktop, drawer at 1100px and below ---- */
  const MENU_BREAK = 1100;
  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('scrim');
  const burger = document.getElementById('hamburger-btn');

  function openDrawer() {
    sidebar.classList.add('open');
    scrim.classList.add('show');
    burger.classList.add('is-open');
    burger.setAttribute('aria-expanded', 'true');
    burger.setAttribute('aria-label', 'Close menu');
    document.body.classList.add('nav-open');
  }
  function closeDrawer() {
    if (!sidebar.classList.contains('open')) return;
    sidebar.classList.remove('open');
    scrim.classList.remove('show');
    burger.classList.remove('is-open');
    burger.setAttribute('aria-expanded', 'false');
    burger.setAttribute('aria-label', 'Open menu');
    document.body.classList.remove('nav-open');
  }
  function syncDock() {
    const fixed = window.innerWidth > MENU_BREAK;
    if (fixed) closeDrawer();
    sidebar.setAttribute('aria-hidden', fixed || sidebar.classList.contains('open') ? 'false' : 'true');
  }
  burger.addEventListener('click', () => sidebar.classList.contains('open') ? closeDrawer() : openDrawer());
  document.getElementById('dock-close').addEventListener('click', closeDrawer);
  scrim.addEventListener('click', closeDrawer);
  window.addEventListener('resize', syncDock);
  syncDock();

  /* ---- user menu ---- */
  const whoami = document.getElementById('topbar-user');
  const whoamiBtn = document.getElementById('topbar-user-btn');
  function closeWhoami() { whoami.classList.remove('open'); whoamiBtn.setAttribute('aria-expanded', 'false'); }
  whoamiBtn.addEventListener('click', e => {
    e.stopPropagation();
    const open = whoami.classList.toggle('open');
    whoamiBtn.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', e => { if (!whoami.contains(e.target)) closeWhoami(); });

  document.getElementById('notif-btn').addEventListener('click', () => navigateTo('alerts'));
  document.getElementById('logout-btn').addEventListener('click', logout);
  document.getElementById('topbar-logout-btn').addEventListener('click', logout);

  /* ---- top bar search: on phones the magnifier opens the field first ---- */
  const finder = document.getElementById('topbar-search');
  const finderInput = document.getElementById('topbar-search-input');
  function openFinder() { finder.classList.add('expanded'); finderInput.focus(); }
  finder.addEventListener('submit', e => {
    e.preventDefault();
    if (window.innerWidth <= 720 && !finder.classList.contains('expanded')) { openFinder(); return; }
    if (!finderInput.value.trim()) { finderInput.focus(); return; }
    go404();
  });
  finderInput.addEventListener('blur', () => { if (!finderInput.value.trim()) finder.classList.remove('expanded'); });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeDrawer(); closeWhoami(); finderInput.blur(); }
    const typing = e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
    if (e.key === '/' && !typing) { e.preventDefault(); openFinder(); }
  });

  /* ---- chart tooltip ---- */
  const tip = document.getElementById('chart-tip');
  function showTip(el) {
    tip.textContent = el.getAttribute('data-tip');
    tip.classList.add('show');
    const r = el.getBoundingClientRect();
    const w = tip.offsetWidth;
    let x = r.left + r.width / 2 - w / 2;
    x = Math.max(8, Math.min(x, window.innerWidth - w - 8));
    tip.style.left = x + 'px';
    tip.style.top = Math.max(8, r.top - tip.offsetHeight - 10) + 'px';
  }
  function hideTip() { tip.classList.remove('show'); }
  document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (t) showTip(t); });
  document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) hideTip(); });
  document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t); });
  document.addEventListener('focusout', hideTip);
  window.addEventListener('scroll', hideTip, { passive: true });

  /* ---- delegated clicks ---- */
  document.addEventListener('click', e => {
    const navBtn = e.target.closest('[data-nav]');
    if (navBtn) { navigateTo(navBtn.getAttribute('data-nav')); return; }
    const df = e.target.closest('.dash-filter');
    if (df) { state.dashCategory = df.dataset.filter; renderPage(false); return; }
    const sf = e.target.closest('.source-filter');
    if (sf) { state.sourceStatus = sf.dataset.filter; renderPage(false); return; }
    const toggle = e.target.closest('[data-toggle]');
    if (toggle) { flipSwitch(toggle); return; }
  });
  document.addEventListener('keydown', e => {
    const toggle = e.target.closest && e.target.closest('[data-toggle]');
    if (toggle && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); flipSwitch(toggle); }
  });
  function flipSwitch(toggle) {
    const key = toggle.dataset.toggle;
    state.settings[key] = !state.settings[key];
    saveSettings();
    toggle.classList.toggle('on', state.settings[key]);
    toggle.setAttribute('aria-checked', String(state.settings[key]));
    if (key === 'compactRows') document.body.classList.toggle('compact', state.settings[key]);
  }

  document.addEventListener('input', e => {
    if (e.target && e.target.id === 'query-search-input') {
      state.querySearch = e.target.value;
      const caret = e.target.selectionStart;
      renderPage(false);
      const input = document.getElementById('query-search-input');
      if (input) { input.focus(); input.setSelectionRange(caret, caret); }
    }
  });
  document.addEventListener('change', e => {
    if (!e.target) return;
    if (e.target.id === 'lang-select')     { state.settings.language = e.target.value; saveSettings(); }
    if (e.target.id === 'currency-select') { state.settings.currency = e.target.value; saveSettings(); }
  });

  /* ---- boot ---- */
  paintUserChrome();
  renderPage();
  </script>
</body>
</html>
